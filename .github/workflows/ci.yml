name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Validate inputs
        run: ou-sec validate
      - name: Lint
        run: ruff check src tests
      - name: Tests (incl. checks that reports and the site are current)
        run: python -m pytest
      - name: Regenerated outputs match the committed ones
        run: |
          ou-sec all
          git diff --exit-code -- 'reports/*.csv' docs/index.html
