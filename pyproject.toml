[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ou-sec"
version = "1.0.0"
description = "Did the University of Oklahoma lose ground moving from the Big 12 to the SEC? A sourced, tested analysis."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<4",
    "matplotlib>=3.8,<4",
    "requests>=2.31,<3",
    "beautifulsoup4>=4.12,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.6"]

[project.scripts]
ou-sec = "ou_sec.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ou_sec = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "single"
